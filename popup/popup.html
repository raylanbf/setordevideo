<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light; }
      body {
        width: 320px;
        margin: 0;
        font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
        color: #1c1c1c;
        background: #f6f7f9;
      }
      header {
        background: #1d3f72;
        color: #fff;
        padding: 12px 14px;
        font-weight: 700;
        font-size: 14px;
      }
      main { padding: 14px; }
      .empty { color: #555; }
      .field { margin-bottom: 10px; }
      .label { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #6b7280; }
      .value { font-size: 15px; font-weight: 600; word-break: break-word; }
      .id { font-size: 22px; color: #1d3f72; }
      button {
        margin-top: 6px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #1d3f72;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #27538f; }
      .hint { margin-top: 12px; font-size: 12px; color: #6b7280; }
      .ts { margin-top: 10px; font-size: 11px; color: #9aa0a6; }
    </style>
  </head>
  <body>
    <header>Setor de Vídeo — Studio</header>
    <main id="content"></main>
    <script src="popup.js"></script>
  </body>
</html>
